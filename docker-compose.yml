services:
  postgres:
    image: postgres:16-alpine
    container_name: postgresK4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-K-news}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-K-news}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redisK4
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-myredispassword}
      - --appendonly
      - "yes"
    ports:
      # Только локально
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-myredispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadminK4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadminpassword}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  php:
    build:
      context: ./docker/php
    container_name: laravel_phpK4
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      # Отдельный volume для vendor, чтобы не пересекался с хостом (опционально)
      # - php_vendor:/var/www/html/vendor
    expose:
      - "9000"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-worker:
    build:
      context: ./docker/app
    container_name: queue_workerK4
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=90"]
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      php:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: laravel_nginxK4
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    depends_on:
      - php

  vite:
    image: node:20-alpine
    container_name: viteK4
    working_dir: /var/www/html
    ports:
      - "5173:5173"[]
    volumes:
      - ./:/var/www/html
      # node_modules — в именованном volume, чтобы не мусорить в репо
      # и не перетираться хостом
      - vite_node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run build"
    networks:
      - backend
    depends_on:
      - php

  telegram-poll:
    build:
      context: ./docker/app
    container_name: telegram_pollK4
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      php:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  vite_node_modules:
  # php_vendor:   # раскомментировать, если используете отдельный volume для vendor

networks:
  backend:
    driver: bridge
